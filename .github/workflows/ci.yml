name: PHP contracts and migration evidence

on:
  pull_request:
  push:
    branches: [main, feature/jcb-mcp-runtime]

permissions:
  contents: read

concurrency:
  group: php-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, sodium, zip, fileinfo, pcntl, posix
          tools: composer:v2
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Verify the committed source ZIP and relocated runtime
        run: |
          mkdir -p build
          git archive --format=zip --prefix=component-source/ --output=build/component-source.zip HEAD
          php tests/package.php build/component-source.zip
      - name: Verify locked dependencies are already installed
        run: composer install --no-dev --no-interaction --no-scripts --dry-run
      - name: PHP syntax
        run: find . -type d \( -name vendor -o -name .git -o -name .reference -o -name build \) -prune -o -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Verify source-pinned seed reproducibility
        run: |
          set -euo pipefail
          php tools/generate-catalogue.php
          git diff --exit-code -- admin/sql admin/data/catalogue-seed.json docs/migration/parity.json
      - name: Behavioural and source-parity contracts
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          for suite in run catalogue schema-shapes execution actions custom-fields field-defaults template-styles menu-components planned jobs process job-process jcb jcb-plan-preview protocol http ownership native/run release; do
            php "tests/$suite.php" | tee "build/evidence/${suite//\//-}.log"
          done
      - name: Preserve the tested PHP runtime for reproducible investigation
        if: always() && matrix.php == '8.3'
        run: |
          set -euo pipefail
          mkdir -p build
          git rev-parse HEAD > build/tested-commit.txt
          tar --exclude-vcs --exclude='./build' --exclude='./.reference' -czf build/tested-php-runtime.tar.gz .
          sha256sum build/tested-php-runtime.tar.gz > build/tested-php-runtime.sha256
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: php-evidence-${{ matrix.php }}
          path: build/
          if-no-files-found: error
          retention-days: 7
