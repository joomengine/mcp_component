name: Publish reviewed message snapshot fix

on:
  push:
    branches: [fix/installed-api-contracts-22-34]
    paths: [.github/workflows/generate-catalogue.yml]

permissions:
  contents: read

concurrency:
  group: publish-reviewed-message-snapshot-fix-30
  cancel-in-progress: false

jobs:
  publish-reviewed-message-snapshot:
    if: github.repository == 'joomengine/mcp_component' && github.ref == 'refs/heads/fix/installed-api-contracts-22-34'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json, mbstring, sodium, zip, fileinfo, pcntl, posix
          coverage: none
      - name: Apply the frozen reviewed change as one coherent group
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 91bb58cdb5a0496032deb0efb195e23026196f2b
          base64 --decode .github/reviewed-message-snapshot.patch.gz.b64 > "$RUNNER_TEMP/reviewed.patch.gz"
          echo "ed04096e250b00ea75d35dae50ad586e73a64b2786992254305b572ac8c2ae08  $RUNNER_TEMP/reviewed.patch.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/reviewed.patch.gz" > "$RUNNER_TEMP/reviewed.patch"
          echo "90b8b2fa58306bc121acd3c0910b562a8f332b523cd8b03c8432279b2cbd9b7b  $RUNNER_TEMP/reviewed.patch" | sha256sum --check
          git apply --check --index "$RUNNER_TEMP/reviewed.patch"
          git apply --index "$RUNNER_TEMP/reviewed.patch"
          python3 - <<'PYVERIFY'
          import json, subprocess
          from pathlib import Path
          manifest = json.loads(Path('.github/reviewed-message-snapshot.json').read_text())
          expected = sorted(item['path'] for item in manifest['files'])
          actual = sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          assert actual == expected, 'Only the reviewed paths may change'
          for item in manifest['files']:
              actual = subprocess.check_output(['git', 'hash-object', item['path']]).decode().strip()
              assert actual == item['gitBlobSha'], 'Reviewed bytes differ: ' + item['path']
              mode = subprocess.check_output(['git', 'ls-files', '-s', item['path']]).decode().split()[0]
              assert mode == item['mode'], 'Reviewed mode differs: ' + item['path']
          PYVERIFY
          git diff --cached --check
      - name: Verify deterministic generation and all PHP contracts
        run: |
          set -euo pipefail
          mkdir -p build/reviewed-publication
          php tools/generate-catalogue.php
          git diff --exit-code
          for suite in run catalogue schema-shapes schema-discovery session-storage wire-protocol stdio-endurance execution actions write-verification message-snapshot article-deletion custom-fields field-defaults template-styles menu-components planned jobs process job-process jcb jcb-plan-preview protocol http ownership native/run release; do
            php "tests/$suite.php" | tee "build/reviewed-publication/${suite//\//-}.log"
          done
      - name: Commit only the frozen verified group to the same branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/installed-api-contracts-22-34 | cut -f1)" = "$GITHUB_SHA"
          # The Actions token publishes content only. The authorized connector
          # applies the reviewed CI registration together with workflow cleanup.
          git restore --source=HEAD --staged --worktree -- .github/workflows/ci.yml
          python3 - <<'PYCONTENT'
          import json, subprocess
          from pathlib import Path
          manifest = json.loads(Path('.github/reviewed-message-snapshot.json').read_text())
          files = [item for item in manifest['files'] if item['path'] != '.github/workflows/ci.yml']
          actual = sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          assert actual == sorted(item['path'] for item in files), 'Only reviewed non-workflow content may be published'
          for item in files:
              actual = subprocess.check_output(['git', 'rev-parse', ':' + item['path']]).decode().strip()
              assert actual == item['gitBlobSha'], 'Reviewed staged bytes differ: ' + item['path']
          PYCONTENT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: acquire pure recipient-scoped message planning snapshots (#30)'
          git push origin HEAD:refs/heads/fix/installed-api-contracts-22-34
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reviewed-message-snapshot-publication
          path: build/reviewed-publication/
          if-no-files-found: ignore
          retention-days: 7
