name: Installed JCB golden image

on:
  pull_request:
  push:
    branches: [main, feature/jcb-mcp-runtime]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jcb-installed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, intl, json, mbstring, sodium, xml, zip
          tools: composer:v2
          coverage: none
      - name: Verify the committed installable component
        run: php tests/package.php
      - name: Check out the JCB implementation under test
        uses: actions/checkout@v7
        with:
          repository: extension-builder/joomla
          ref: 5ee658dd07eb749dca43ed4722f6cca7eb8208cf
          path: build/jcb-source
          persist-credentials: false
      - name: Check out the reviewed console plugin under test
        uses: actions/checkout@v7
        with:
          repository: joomengine/mcp_plugin
          ref: eab466cfb51c9ef51bdb2f18431c2e2fcdafbc3b
          path: build/plugin-source
          persist-credentials: false
      - name: Check out the remote client bridge under test
        uses: actions/checkout@v7
        with:
          repository: joomengine/mcp_client
          ref: 881b1006b67afc24d35d17b82cd32d16a5593a44
          path: build/client-source
          persist-credentials: false
      - name: Check out the independent webservices plugin under test
        uses: actions/checkout@v7
        with:
          repository: joomengine/mcp_webservices
          ref: 7853f864d70ff8aea43c488bc3a93bd6e5724623
          path: build/webservices-source
          persist-credentials: false
      - name: Install the client dependencies for the remote acceptance scenario
        working-directory: build/client-source
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install the component into the JCB golden image and exercise native Joomla
        env:
          COMPOSE_PROJECT_NAME: mcp-${{ github.run_id }}-${{ github.run_attempt }}
          MCP_PLUGIN_SOURCE: ${{ github.workspace }}/build/plugin-source
          MCP_WEBSERVICES_SOURCE: ${{ github.workspace }}/build/webservices-source
          MCP_CLIENT_SOURCE: ${{ github.workspace }}/build/client-source
        run: bash tests/golden-image/run.sh
      - name: Preserve redacted installation and execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-jcb-golden-image
          path: build/evidence/golden/
          retention-days: 14
          if-no-files-found: error
