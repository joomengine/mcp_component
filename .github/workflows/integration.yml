name: Installed Joomla component

on:
  pull_request:
  push:
    branches: [main, feature/jcb-mcp-runtime]

permissions:
  contents: read

concurrency:
  group: installed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        database: [pgsql, mysqli]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mcp_fixture
          POSTGRES_USER: mcp_test
          POSTGRES_PASSWORD: disposable-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcp_test -d mcp_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 15
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mcp_fixture
          MYSQL_USER: mcp_test
          MYSQL_PASSWORD: disposable-test-password
          MYSQL_ROOT_PASSWORD: disposable-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pdisposable-root-password"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out the reviewed console plugin under test
        uses: actions/checkout@v7
        with:
          repository: joomengine/mcp_plugin
          ref: e9a97f2b0871058522670b28485ff19f68102b1c
          path: build/plugin-source
          persist-credentials: false
      - name: Check out the remote client bridge under test
        uses: actions/checkout@v7
        with:
          repository: joomengine/mcp_client
          ref: 7a84f92b18438fe1e2f893d2aacbf34f03d60606
          path: build/client-source
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, intl, json, mbstring, mysqli, pcntl, pdo_mysql, pgsql, pdo_pgsql, posix, simplexml, sodium, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install the client dependencies for HTTPS and remote stdio acceptance
        working-directory: build/client-source
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Build a complete distributable with its PHP dependencies
        run: |
          bash tools/build.sh
          bash tools/build-distribution.sh "$GITHUB_WORKSPACE/build/plugin-source"
          mkdir -p build/evidence
          git -C build/plugin-source rev-parse HEAD > build/evidence/console-plugin-source.txt
          git -C build/client-source rev-parse HEAD > build/evidence/client-source.txt
      - name: Validate packaged files and native manifests
        run: |
          php tests/package.php --distribution
          php tests/release.php
      - name: Install, execute HTTP, console and HTTPS client operations, then upgrade
        env:
          MCP_TEST_ALLOW_DESTRUCTIVE: '1'
          JOOMLA_ROOT: ${{ runner.temp }}/joomla
          MCP_TEST_DB_TYPE: ${{ matrix.database }}
          MCP_TEST_DB_HOST: ${{ matrix.database == 'pgsql' && '127.0.0.1:5432' || '127.0.0.1:3306' }}
          MCP_TEST_DB_USER: mcp_test
          MCP_TEST_DB_PASS: disposable-test-password
          MCP_TEST_DB_NAME: mcp_fixture
          MCP_PLUGIN_SOURCE: ${{ github.workspace }}/build/plugin-source
          MCP_CLIENT_SOURCE: ${{ github.workspace }}/build/client-source
        run: bash tests/integration/run.sh
      - name: Preserve redacted evidence and the development package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-${{ matrix.database }}-php-${{ matrix.php }}
          path: |
            build/evidence/
            build/*joomengine_mcp-*.zip
            build/*joomengine_mcp-*.zip.sha256
            build/distribution.json
          if-no-files-found: error
          retention-days: 7
